
name: Build Legendary Arsenal

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Extract source code
        run: |
          unzip -o src.zip -d .
          test -f build.gradle.kts
          test -d src/main/java
          test -d src/main/resources

      - name: Build plugin
        run: gradle build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: LegendaryArsenal-JAR
          path: build/libs/*.jar
          if-no-files-found: error
          
